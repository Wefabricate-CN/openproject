name: Wefabricate wf02 Deployment

# Builds the all-in-one image from the wf02 branch on a GitHub-hosted runner (free
# for this public repo, and the WF02 site's link to Docker Hub, rubygems and npm is
# too slow for a 30-minute Ruby + Node build), pushes it to GHCR, then lets the
# Wefabricate-CN runner inside WF02 redeploy the Portainer stack, which pulls it.
#
# Needs: secret PORTAINER_TOKEN_WF02, repo variable PORTAINER_STACK_ID_WF02 (see
# .wefabricate/wf02/portainer-stack.yml), and an org runner labelled wf02 in a
# runner group that allows this public repository.
#
# Only push and manual dispatch trigger this workflow; never add pull_request here,
# since a PR from a fork would then run on the runner inside the WF02 network.

on:
  push:
    branches: [wf02]
  workflow_dispatch:

concurrency:
  group: wf02-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/wefabricate-cn/openproject

jobs:
  build:
    if: github.repository == 'Wefabricate-CN/openproject'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One build, two tags: wf02 (what the stack runs) and the commit (to roll back to).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          target: all-in-one
          push: true
          tags: |
            ${{ env.IMAGE }}:wf02
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Until the stack exists (first run), only the image is pushed.
    if: ${{ vars.PORTAINER_STACK_ID_WF02 != '' }}
    runs-on: [self-hosted, wf02]
    # a deploy whose layers are new pulls well over a gigabyte over the site link
    timeout-minutes: 75
    env:
      PORTAINER_URL: https://portainer.wf02.wefabricate.cn
      PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN_WF02 }}
      STACK_ID: ${{ vars.PORTAINER_STACK_ID_WF02 }}
      # the Portainer registry entry holding the GHCR pull credentials
      REGISTRY_NAME: ghcr-wefabricate-cn
      CONTAINER: openproject
      HEALTH_URL: https://openproject.wf02.wefabricate.cn/health_checks/default
    steps:
      # Portainer responses carry the stack's Env and the container's Env (secrets), and
      # GitHub only masks registered secrets: keep every response in a variable or file and
      # print only the fields picked out with jq.
      - name: Look up the stack
        run: |
          if [ -z "$PORTAINER_TOKEN" ]; then
            echo "Error: secret 'PORTAINER_TOKEN_WF02' is not set."
            exit 1
          fi
          stack_info=$(curl -k --fail --max-time 30 --connect-timeout 10 --silent --show-error \
            -H "X-API-Key: $PORTAINER_TOKEN" "$PORTAINER_URL/api/stacks/$STACK_ID")
          echo "ENDPOINT_ID=$(echo "$stack_info" | jq -r '.EndpointId')" >> "$GITHUB_ENV"

      # The stack update below answers at once and pulls in the background under its own
      # deadline, which a full pull over the site link can overrun, leaving the old image
      # running behind a green job. Pulling first, through the Docker proxy with the client
      # attached for as long as it takes, leaves the stack update only a manifest check.
      - name: Pull the new image onto the WF02 host
        run: |
          registry_id=$(curl -k --fail --max-time 30 --connect-timeout 10 --silent --show-error \
            -H "X-API-Key: $PORTAINER_TOKEN" "$PORTAINER_URL/api/registries" \
            | jq -r --arg name "$REGISTRY_NAME" '.[] | select(.Name == $name) | .Id')
          if [ -z "$registry_id" ]; then
            echo "::error::Portainer has no registry named $REGISTRY_NAME"
            exit 1
          fi
          # Portainer swaps a {"registryId": n} header for that registry's credentials.
          registry_auth=$(printf '{"registryId":%s}' "$registry_id" | base64 -w0)

          pull_log=$(mktemp -p "${RUNNER_TEMP:-/tmp}")
          trap 'rm -f "$pull_log"' EXIT
          started=$(date +%s)
          curl -k --fail --max-time 4200 --connect-timeout 10 --silent --show-error --no-buffer \
            -X POST -H "X-API-Key: $PORTAINER_TOKEN" -H "X-Registry-Auth: $registry_auth" \
            "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/images/create?fromImage=$IMAGE&tag=$GITHUB_SHA" \
            > "$pull_log"

          # Docker reports a failed pull inside a 200 stream.
          if jq -e -s 'map(select(.error != null)) | length > 0' "$pull_log" > /dev/null; then
            echo "::error::Pull failed: $(jq -r -s 'map(.error // empty) | first' "$pull_log")"
            exit 1
          fi
          downloaded=$(jq -r -s '[.[] | select(.status == "Pull complete")] | length' "$pull_log")
          cached=$(jq -r -s '[.[] | select(.status == "Already exists")] | length' "$pull_log")
          echo "Pulled $IMAGE:$GITHUB_SHA in $(( $(date +%s) - started )) s: $downloaded layers downloaded, $cached already on the host."

          image_id=$(curl -k --fail --max-time 30 --connect-timeout 10 --silent --show-error \
            -H "X-API-Key: $PORTAINER_TOKEN" \
            "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/images/$IMAGE:$GITHUB_SHA/json" | jq -r '.Id')
          echo "IMAGE_ID=$image_id" >> "$GITHUB_ENV"

      # Same request as wefabricate/reusable-actions portainer-stack-reload-v2, which a
      # repository outside the wefabricate org cannot call.
      - name: Trigger Portainer stack reload
        run: |
          stack_info=$(curl -k --fail --max-time 30 --connect-timeout 10 --silent --show-error \
            -H "X-API-Key: $PORTAINER_TOKEN" "$PORTAINER_URL/api/stacks/$STACK_ID")
          stack_env=$(echo "$stack_info" | jq '.Env // []')

          stack_file=$(curl -k --fail --max-time 30 --connect-timeout 10 --silent --show-error \
            -H "X-API-Key: $PORTAINER_TOKEN" "$PORTAINER_URL/api/stacks/$STACK_ID/file")
          stack_file_content=$(echo "$stack_file" | jq -r '.StackFileContent')

          body_file=$(mktemp -p "${RUNNER_TEMP:-/tmp}")
          response_file=$(mktemp -p "${RUNNER_TEMP:-/tmp}")
          trap 'rm -f "$body_file" "$response_file"' EXIT
          # body goes via a file so the env values stay off the curl command line
          jq -n --arg content "$stack_file_content" --argjson env "$stack_env" \
            '{stackFileContent: $content, env: $env, prune: false, PullImage: true}' > "$body_file"

          if ! curl -k --fail-with-body --max-time 840 --connect-timeout 10 --silent --show-error \
            -X PUT -H "X-API-Key: $PORTAINER_TOKEN" -H "Content-Type: application/json" \
            --data-binary "@$body_file" --output "$response_file" \
            "$PORTAINER_URL/api/stacks/$STACK_ID?endpointId=$ENDPOINT_ID"; then
            reason=$(jq -r '[.message, .details] | map(select(. != null and . != "")) | join(": ")' "$response_file" 2>/dev/null \
              || head -c 500 "$response_file")
            echo "::error::Redeploy of stack $STACK_ID failed: $reason"
            exit 1
          fi

          # the response is the full stack object including Env: print only the identity fields
          jq -c '{Id, Name, Status}' "$response_file"

      # The reload is asynchronous, so a green request proves nothing: wait until the
      # container runs the pulled image and the application answers its health check.
      - name: Verify the new image is serving
        run: |
          deadline=$(( $(date +%s) + 1200 ))
          while :; do
            running=$(curl -k --max-time 30 --connect-timeout 10 --silent \
              -H "X-API-Key: $PORTAINER_TOKEN" \
              "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/containers/$CONTAINER/json" \
              | jq -r '"\(.Image // "") \(.State.Status // "")"' 2>/dev/null || true)
            health=$(curl -k --max-time 15 --connect-timeout 10 --silent "$HEALTH_URL" || true)
            if [ "${running% *}" = "$IMAGE_ID" ] && [ "${running#* }" = "running" ] \
              && echo "$health" | grep -q 'PASSED'; then
              echo "$CONTAINER runs ${IMAGE_ID:7:12} and passes $HEALTH_URL"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::After 20 min $CONTAINER runs ${running% *} (${running#* }), not $IMAGE_ID; health: ${health:0:200}"
              exit 1
            fi
            sleep 15
          done
